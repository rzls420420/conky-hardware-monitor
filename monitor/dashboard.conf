local home = os.getenv('HOME') or ''
local conf_dir = debug.getinfo(1, 'S') and debug.getinfo(1, 'S').source:match('^@(.*/)') or nil

local function first_readable(paths)
    for _, p in ipairs(paths) do
        local f = io.open(p, 'r')
        if f then
            f:close()
            return p
        end
    end
    return paths[1]
end

local lua_path = first_readable({
    conf_dir and (conf_dir .. 'dashboard.lua') or '',
    home ~= '' and (home .. '/.config/conky/dashboard.lua') or '',
    '/usr/share/conky-hardware-monitor/dashboard.lua',
})

local saved_align = 'top_right'
local saved_x = 28
local saved_y = 64

local pos_path = home ~= '' and (home .. '/.config/conky/position.txt') or 'position.txt'
local pos_file = io.open(pos_path, 'r')
if pos_file then
    local line = pos_file:read('*l')
    pos_file:close()
    if line then
        local sx, sy = line:match('^%s*(-?%d+)%s+(-?%d+)%s*$')
        if sx and sy then
            saved_align = 'top_left'
            saved_x = tonumber(sx)
            saved_y = tonumber(sy)
        end
    end
end

conky.config = {
    alignment = saved_align,
    background = false,
    border_inner_margin = 0,
    border_outer_margin = 0,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'F6F9FD',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    gap_x = saved_x,
    gap_y = saved_y,
    lua_draw_hook_pre = 'conky_draw_dashboard',
    lua_load = lua_path,
    lua_mouse_hook = 'conky_mouse_hook',
    lua_shutdown_hook = 'conky_shutdown',
    lua_startup_hook = 'conky_startup',
    maximum_width = 436,
    minimum_height = 580,
    minimum_width = 436,
    net_avg_samples = 2,
    no_buffers = true,
    own_window = true,
    own_window_argb_visual = true,
    own_window_class = 'ConkyDashboard',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_type = 'normal',
    stippled_borders = 0,
    update_interval = 2.0,
    use_xft = true,
    xftalpha = 1.0,
}

conky.text = [[ ]]
